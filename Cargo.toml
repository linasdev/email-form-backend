[package]
name = "email-form-backend"
description = "Email form backend"
authors = ["Linas Nikiperavičius <linas@linasdev.com>"]
repository = "https://github.com/linasdev/email-form-backend"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies.actix-web]
version = "4.18.1"

[dependencies.config]
version = "0.15.27"

[dependencies.env_logger]
version = "0.11.11"

[dependencies.lettre]
version = "0.11.23"
default-features = false
features = ["smtp-transport", "pool", "hostname", "builder", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"]

[dependencies.log]
version = "0.4.34"

[dependencies.reqwest]
version = "0.13.5"
features = ["json", "form"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.validator]
version = "0.21.0"
features = ["derive"]

[dev-dependencies.googletest]
version = "0.14.3"

[dev-dependencies.serde_json]
version = "1.0.154"
